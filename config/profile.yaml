workHistorySummary:
  '25+ years of hands-on software engineering across frontend, backend, cloud and architecture.
  Recent consulting at Ingeno (2024–2026): React/Next.js/NestJS business applications, Prisma and Playwright at
  ACI Montreal; TypeScript/GraphQL industrial analytics and PostgreSQL/AWS RDS performance tuning at Bridor; AWS
  deployment and container scaling, IoT and Node-RED at Valmetal; React/TypeScript advertising workflows at Live
  Nation/Ticketmaster; Capsule.AI Chrome extension and Terraform-to-CDK migration. Croix Bleue/GeoBlue (2020–2024):
  React insurance claims applications, Node.js BFF and OAuth 2.0, Okta-to-Auth0 migration, Java/Spring Boot microservices,
  DDD, CQRS, AxonIQ Sagas, Event Sourcing, RabbitMQ, integrations with Salesforce and SharePoint. Earlier experience
  includes Go APIs backed by DynamoDB, AWS CI/CD, Cognito and JavaScript/TypeScript modernization. Daily AI-assisted
  coding with Cursor, Claude Code and CodeRabbit. Personal NestJS insurance AI agent with tool calling, LangChain
  and AWS Bedrock; RAG, MCP and LangGraph are learning interests rather than established production expertise. Pragmatic
  hands-on ownership, maintainability, performance, security and product delivery. Fluent in English and French.'
