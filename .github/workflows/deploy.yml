name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected GitHub environment to deploy
        required: true
        type: choice
        options: [dev, prod]

permissions:
  contents: read
  id-token: write

concurrency:
  group: job-scout-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Plan and apply
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ inputs.environment }}

    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
      TF_VAR_environment: ${{ inputs.environment }}
      TF_VAR_notification_email: ${{ secrets.NOTIFICATION_EMAIL }}
      TF_VAR_sender_email: ${{ secrets.SENDER_EMAIL }}
      TF_VAR_schedule_enabled: ${{ vars.SCHEDULE_ENABLED || 'false' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Build and test artifact
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run build
          npm run package

      - name: Configure AWS credentials through OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Configure remote state
        working-directory: infra/terraform
        env:
          TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
        run: |
          test -n "$TF_STATE_BUCKET"
          printf 'terraform {\n  backend "s3" {}\n}\n' > backend.tf
          terraform init \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=${{ inputs.environment }}/job-scout.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}" \
            -backend-config="use_lockfile=true" \
            -backend-config="encrypt=true"

      - name: Check Terraform formatting
        run: terraform -chdir=infra/terraform fmt -check -recursive

      - name: Plan exact deployment
        run: terraform -chdir=infra/terraform plan -out=tfplan

      - name: Apply reviewed plan
        run: terraform -chdir=infra/terraform apply -auto-approve tfplan
